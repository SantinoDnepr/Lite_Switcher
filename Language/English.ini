; Lite Switcher - English texts.
; This file is built into the programs (it is the fallback for every language) and can be edited
; to change the English texts. Do not translate keys, only values. {name} is a placeholder.

[language]
code = en
name = English

[app]
title = Lite Switcher - Settings

[tray]
tooltip = Lite Switcher
auto_switching = auto-switching
settings = Settings...
exit = Exit

[tabs]
common = Common
hotkeys = Hotkeys
troubleshooting = Troubleshooting
sounds = Sounds

[buttons]
save = Save
reload = Reload
change = Change...
clear = Clear
default = Default
cancel = Cancel
up = Up
down = Down
open_config_folder = Open the config folder

[common]
layouts_heading = Keyboard layouts
all_layouts = All system layouts (auto)
layouts_auto_hint = Uncheck the layouts that must not take part in the conversion cycle.
layouts_manual_hint = Checked layouts take part in the cycle, in the order shown below.
not_installed = (not installed)
general_heading = General
auto_switching = auto-switching
auto_switching_hint = Automatic layout switching is not implemented yet: the flag is only stored.
autostart = Start with Windows
show_tray_icon = Show the tray icon
keep_trailing_space = Keep spaces typed after the word when converting
language = Language:

[hotkeys]
heading = Hotkeys
convert_word = Convert the last word
convert_selection = Convert the selected text
invert_case = Invert the case of the selected text
toggle_autoswitch = Turn the auto-switching on / off
press_new = press the new hotkey...
not_set = (not set)
note = Pause and Break are the same key. Pressing the word hotkey again cycles through the other layouts and back to the original one.

[troubleshooting]
heading = Troubleshooting
log_enabled = Write a log file (restart the daemon to apply)
log_level = Log level:
key_delay = Pause between synthetic keys (ms):
ignored_apps = Ignored applications (executable names, one per line, e.g. game.exe):

[sounds]
heading = Sounds
enabled = Play a sound after the conversion
path = Path to a .wav file (empty = the system default sound):

[status]
config_path = Config: {path}
config_read_error_defaults = Cannot read the config, defaults are shown: {error}
select_layout = Select at least one layout (or enable All system layouts).
save_error = Cannot save the config: {error}
saved = Saved. A running daemon applies the changes automatically.
autostart_error = Saved, but autostart was not updated: {error}
daemon_not_found = Saved, but lite-switcher.exe was not found next to this program (autostart skipped).
reloaded = Reloaded from file.
reload_error = Cannot read the config: {error}
duplicate_hotkey = The hotkey {hotkey} is assigned to more than one action.

; Names of the keyboard layouts, by locale id. Layouts that are not listed here are shown
; with the English name given by Windows.
[layouts]
en-US = English (USA)
ru-RU = Russian (Russia)
uk-UA = Ukrainian (Ukraine)
