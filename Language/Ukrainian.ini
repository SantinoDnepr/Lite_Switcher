; Lite Switcher - український переклад.
; Ключі не перекладаються, лише значення. {name} - підстановка, її потрібно зберегти.
; Набір ключів має збігатися з English.ini (це перевіряє тест).

[language]
code = uk
name = Ukrainian

[app]
title = Lite Switcher - Налаштування

[tray]
tooltip = Lite Switcher
auto_switching = Автоперемикання
settings = Налаштування...
exit = Вихід

[tabs]
common = Загальні
hotkeys = Гарячі клавіші
troubleshooting = Усунення проблем
sounds = Звуки

[buttons]
save = Зберегти
reload = Перечитати
change = Змінити...
clear = Очистити
default = За замовчуванням
cancel = Скасувати
up = Вгору
down = Вниз
open_config_folder = Відкрити теку з конфігом

[common]
layouts_heading = Розкладки клавіатури
all_layouts = Усі розкладки системи (авто)
layouts_auto_hint = Зніміть позначки з розкладок, які не мають брати участь у циклі конвертації.
layouts_manual_hint = Розкладки з позначкою беруть участь у циклі в показаному нижче порядку.
not_installed = (не встановлена)
general_heading = Загальне
auto_switching = автоперемикання
auto_switching_hint = Автоматичне перемикання розкладки поки не реалізоване: прапорець лише зберігається.
autostart = Запускати разом із Windows
show_tray_icon = Показувати значок у треї
keep_trailing_space = Зберігати пробіли, набрані після слова, під час конвертації
language = Мова:

[hotkeys]
heading = Гарячі клавіші
convert_word = Конвертувати останнє слово
convert_selection = Конвертувати виділений текст
invert_case = Інвертувати регістр виділеного тексту
toggle_autoswitch = Увімкнути / вимкнути автоперемикання
press_new = натисніть нову комбінацію...
not_set = (не задана)
note = Pause і Break - це одна й та сама клавіша. Повторне натискання клавіші для слова перемикає по колу решту розкладок і повертає початкову.

[troubleshooting]
heading = Усунення проблем
log_enabled = Вести лог-файл (для застосування перезапустіть демон)
log_level = Рівень логу:
key_delay = Пауза між синтетичними натисканнями (мс):
ignored_apps = Ігноровані програми (імена exe-файлів, по одному в рядку, наприклад game.exe):

[sounds]
heading = Звуки
enabled = Відтворювати звук після конвертації
path = Шлях до .wav-файлу (порожньо = системний звук за замовчуванням):

[status]
config_path = Конфіг: {path}
config_read_error_defaults = Не вдалося прочитати конфіг, показано значення за замовчуванням: {error}
select_layout = Виберіть принаймні одну розкладку (або ввімкніть Усі розкладки системи).
save_error = Не вдалося зберегти конфіг: {error}
saved = Збережено. Запущений демон застосує зміни автоматично.
autostart_error = Збережено, але автозапуск не оновлено: {error}
daemon_not_found = Збережено, але lite-switcher.exe не знайдено поруч із цією програмою (автозапуск пропущено).
reloaded = Перечитано з файлу.
reload_error = Не вдалося прочитати конфіг: {error}
duplicate_hotkey = Комбінацію {hotkey} призначено більше ніж одній дії.
