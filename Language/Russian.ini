; Lite Switcher - русский перевод.
; Ключи не переводятся, только значения. {name} - подстановка, её нужно сохранить.
; Набор ключей должен совпадать с English.ini (это проверяет тест).

[language]
code = ru
name = Russian

[app]
title = Lite Switcher - Настройки

[tray]
tooltip = Lite Switcher
auto_switching = Автопереключение
settings = Настройки...
exit = Выход

[tabs]
common = Общие
hotkeys = Горячие клавиши
troubleshooting = Устранение неполадок
sounds = Звуки

[buttons]
save = Сохранить
reload = Перечитать
change = Изменить...
clear = Очистить
default = По умолчанию
cancel = Отмена
up = Вверх
down = Вниз
open_config_folder = Открыть папку с конфигом

[common]
layouts_heading = Раскладки клавиатуры
all_layouts = Все раскладки системы (авто)
layouts_auto_hint = Снимите галочки с раскладок, которые не должны участвовать в цикле конвертации.
layouts_manual_hint = Раскладки с галочкой участвуют в цикле в показанном ниже порядке.
not_installed = (не установлена)
general_heading = Общее
auto_switching = автопереключение
auto_switching_hint = Автоматическое переключение раскладки пока не реализовано: флаг только сохраняется.
autostart = Запускать вместе с Windows
show_tray_icon = Показывать значок в трее
keep_trailing_space = Сохранять пробелы, набранные после слова, при конвертации
language = Язык:

[hotkeys]
heading = Горячие клавиши
convert_word = Конвертировать последнее слово
convert_selection = Конвертировать выделенный текст
invert_case = Инвертировать регистр выделенного текста
toggle_autoswitch = Включить / выключить автопереключение
press_new = нажмите новую комбинацию...
not_set = (не задана)
note = Pause и Break - одна и та же клавиша. Повторное нажатие клавиши для слова переключает по кругу остальные раскладки и возвращает исходную.

[troubleshooting]
heading = Устранение неполадок
log_enabled = Вести лог-файл (для применения перезапустите демон)
log_level = Уровень лога:
key_delay = Пауза между синтетическими нажатиями (мс):
ignored_apps = Игнорируемые программы (имена exe-файлов, по одному в строке, например game.exe):

[sounds]
heading = Звуки
enabled = Проигрывать звук после конвертации
path = Путь к .wav-файлу (пусто = системный звук по умолчанию):

[status]
config_path = Конфиг: {path}
config_read_error_defaults = Не удалось прочитать конфиг, показаны значения по умолчанию: {error}
select_layout = Выберите хотя бы одну раскладку (или включите Все раскладки системы).
save_error = Не удалось сохранить конфиг: {error}
saved = Сохранено. Запущенный демон применит изменения автоматически.
autostart_error = Сохранено, но автозапуск не обновлён: {error}
daemon_not_found = Сохранено, но lite-switcher.exe не найден рядом с этой программой (автозапуск пропущен).
reloaded = Перечитано из файла.
reload_error = Не удалось прочитать конфиг: {error}
duplicate_hotkey = Сочетание {hotkey} назначено более чем одному действию.
